name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render's free tier from sleeping (which happens after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          # Use the RENDER_URL secret if defined, otherwise fallback to a generic URL
          # (Render instances usually end in .onrender.com)
          URL="${{ secrets.RENDER_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_URL secret is not set! Using fallback..."
            # Adjust this fallback to your specific render URL
            URL="https://hadkar-meals.onrender.com"
          fi
          
          echo "Pinging $URL to keep it alive..."
          curl -sS "$URL" > /dev/null || echo "Ping failed, but workflow will continue"

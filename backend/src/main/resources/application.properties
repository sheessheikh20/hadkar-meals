server.port=${PORT:8081}
server.address=0.0.0.0
spring.application.name=hadkar-meals

# Database Configuration (SQLite with WAL mode)
spring.datasource.url=jdbc:sqlite:./data/hadkarmeals.db
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA busy_timeout=10000; PRAGMA synchronous=NORMAL; PRAGMA foreign_keys=ON;
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
hadkar.jwt.secret=4a7c3b28f1e54d89a7c3b28f1e54d89a7c3b28f1e54d89a7c3b28f1e54d89b3f
hadkar.jwt.expiration-ms=86400000

# OTP Configuration
hadkar.otp.dev-mock=true
hadkar.otp.dev-code=123456
hadkar.otp.expiry-minutes=5
hadkar.otp.max-attempts=3

# Business Settings
hadkar.business.name=Hadkar Meals
hadkar.business.tagline=Fresh Meals. Every Day.
hadkar.business.subtagline=Ghar Ka Khana, Hostel Tak.
hadkar.business.phone=+91 98765 43210
hadkar.business.upi-id=hadkarmeals@okaxis

# App URLs for Invoice links & QR (Render / Vercel deployment)
hadkar.app.backend-base-url=${BACKEND_BASE_URL:http://localhost:8081}
hadkar.app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5174}

# Swagger OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
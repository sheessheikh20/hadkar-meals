server.port=8081
spring.application.name=hadkar-meals

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hadkarmeals}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
hadkar.jwt.secret=${JWT_SECRET:4a7c3b28f1e54d89a7c3b28f1e54d89a7c3b28f1e54d89a7c3b28f1e54d89b3f}
hadkar.jwt.expiration-ms=86400000

# OTP Configuration
hadkar.otp.dev-mock=${OTP_DEV_MOCK:false}
hadkar.otp.dev-code=${OTP_DEV_CODE:123456}
hadkar.otp.expiry-minutes=5
hadkar.otp.max-attempts=3

# External SMS / WhatsApp Providers (Optional production hooks)
hadkar.sms.provider=${SMS_PROVIDER:MOCK}
hadkar.sms.api-key=${SMS_API_KEY:}
hadkar.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}

# Business Settings
hadkar.business.name=Hadkar Meals
hadkar.business.tagline=Fresh Meals. Every Day.
hadkar.business.subtagline=Ghar Ka Khana, Hostel Tak.
hadkar.business.phone=+91 98765 43210
hadkar.business.upi-id=hadkarmeals@okaxis
